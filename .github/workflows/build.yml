name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to attach the .exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --lib

      - name: Build
        run: cargo build --release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: monitor-lizard
          path: |
            target/release/monitor-lizard-ui.exe
            target/release/monitor-lizard.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/monitor-lizard-ui.exe
            target/release/monitor-lizard.exe
